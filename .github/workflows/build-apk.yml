name: Build Nova APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Nova.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Nova-APK
          path: Nova.apk

      - name: Publish download link (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Nova (latest APK)
          body: Nova.apk download karein aur phone me install karein.
          files: Nova.apk
